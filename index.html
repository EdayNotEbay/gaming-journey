<!doctype html> <!-- Declare the document as modern HTML5. -->
<html lang="en"> <!-- Set English as the website language for browsers and accessibility tools. -->
  <head> <!-- Start the document metadata section. -->
    <meta charset="UTF-8" /> <!-- Use UTF-8 so normal text and symbols display correctly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Make the responsive layout match the visitor's device width. -->
    <meta name="description" content="My Gaming Journey is a personal timeline of the games, platforms, genres, favorites, and rankings that shaped my gaming experience." /> <!-- Describe the website for search engines and link previews. -->
    <meta name="keywords" content="gaming journey, video games, gaming timeline, game rankings, favorite games, game genres" /> <!-- Provide relevant keywords that describe the website topic. -->
    <meta name="author" content="My Gaming Journey" /> <!-- Identify the website project as the page author. -->
    <meta name="theme-color" content="#061229" /> <!-- Match supported browser chrome to the website's navy design. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- Keep the website favicon reference available to supported browsers. -->
    <title>My Gaming Journey | Timeline and Game Rankings</title> <!-- Give the browser tab a clear and descriptive page title. -->
  </head> <!-- Finish the document metadata section. -->
  <body> <!-- Start the visible application document. -->
    <div id="root"></div> <!-- Give React the element where the complete website will render. -->
    <script type="module" src="/src/main.jsx"></script> <!-- Load the React application entry file as a JavaScript module. -->
  </body> <!-- Finish the visible application document. -->
</html> <!-- Finish the HTML document. -->
